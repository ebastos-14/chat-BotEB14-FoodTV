<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <title>Editor de mapa - chat-BotEB14-FoodTV</title>
  <link rel="stylesheet" href="./editor.css">
</head><body>
  <header class="editor-header">
    <div>
      <h1>Editor de mapa</h1>
      <p>chat-BotEB14-FoodTV</p>
    </div><div id="editor-status">
  Cargando...
</div>

  </header>  <main class="editor-layout"><section class="map-panel">
  <canvas
    id="editor-canvas"
    width="1536"
    height="1536"
    aria-label="Editor visual del mapa"
  ></canvas>
</section>

<aside class="editor-panel">

  <section>
    <h2>Elemento</h2>

    <label>
      Elemento
      <select id="element-select">
        <option value="">Seleccionar...</option>
      </select>
    </label>

    <div id="element-info" class="element-info">
      Ningún elemento seleccionado.
    </div>
  </section>

  <section>
    <h2>Raptor</h2>

    <label>
      Variante
      <select id="raptor-sheet">
        <option value="">Seleccionar...</option>
      </select>
    </label>

    <label>
      Perfil
      <select id="raptor-profile">
        <option value="lateral">Lateral</option>
        <option value="front">Front</option>
        <option value="back">Back</option>
      </select>
    </label>

    <div class="sprite-preview">
      <div class="sprite-preview-title">
        Vista previa
      </div>

      <canvas
        id="sprite-preview"
        width="220"
        height="220"
      ></canvas>
    </div>
  </section>

  <section>
    <h2>Transformación</h2>

    <label>
      X
      <input
        id="element-x"
        type="number"
        step="1"
      >
    </label>

    <label>
      Y
      <input
        id="element-y"
        type="number"
        step="1"
      >
    </label>

    <label>
      Escala
      <input
        id="element-scale"
        type="number"
        step="0.0001"
        min="0.01"
      >
    </label>

    <label class="checkbox-label">
      <input
        id="element-mirror"
        type="checkbox"
      >
      Mirror horizontal
    </label>

    <label>
      Layer
      <input
        id="element-layer"
        type="number"
        step="1"
      >
    </label>

    <button id="apply-element">
      Aplicar cambios
    </button>
  </section>

  <section>
    <h2>Ubicaciones</h2>

    <div
      id="element-list"
      class="element-list"
    ></div>

    <button id="add-element">
      Añadir Raptor
    </button>

    <button id="delete-element">
      Eliminar seleccionado
    </button>

    <button id="reset-map">
      Restaurar mapa
    </button>
  </section>

  <section>
    <h2>JSON</h2>

    <button id="export-json">
      Exportar JSON
    </button>

    <button id="copy-json">
      Copiar JSON
    </button>

    <button id="import-json">
      Importar JSON
    </button>

    <textarea
      id="json-data"
      rows="12"
      spellcheck="false"
      placeholder="Aquí aparecerá el JSON del mapa..."
    ></textarea>
  </section>

  <div
    id="editor-message"
    role="status"
    aria-live="polite"
  ></div>

</aside>

  </main>  <script type="module" src="./editor.js"></script></body>
</html>
