<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8"><meta
name="viewport"

«»

  <title>Editor - chat-BotEB14-FoodTV</title>  <link
    rel="stylesheet"
    href="/editor/editor.css"
  >
</head><body>  <main class="editor-page"><header class="editor-header">
  <h1>Editor del restaurante</h1>

  <p>
    Selecciona el módulo que deseas editar.
  </p>
</header>

<section
  id="editor-selector"
  class="editor-selector"
>

  <button
    id="open-raptor-editor"
    type="button"
    class="editor-module-button"
  >
    <strong>Raptors</strong>

    <span>
      Editar ubicaciones, perfiles,
      sprites y posiciones de Raptors.
    </span>
  </button>

  <button
    id="open-food-editor"
    type="button"
    class="editor-module-button"
  >
    <strong>Food</strong>

    <span>
      Editar comidas, bebidas y bolsas.
    </span>
  </button>

</section>

<section
  id="editor-container"
  class="editor-container"
  hidden
>

  <div class="editor-toolbar">

    <button
      id="back-to-editor-selector"
      type="button"
    >
      ← Volver
    </button>

    <strong id="active-editor-name">
      Editor
    </strong>

  </div>

  <iframe
    id="editor-frame"
    title="Editor del restaurante"
    loading="eager"
  ></iframe>

</section>

  </main>  <script type="module">

    const selector =
      document.querySelector(
        "#editor-selector"
      );

    const container =
      document.querySelector(
        "#editor-container"
      );

    const frame =
      document.querySelector(
        "#editor-frame"
      );

    const activeEditorName =
      document.querySelector(
        "#active-editor-name"
      );

    const openRaptor =
      document.querySelector(
        "#open-raptor-editor"
      );

    const openFood =
      document.querySelector(
        "#open-food-editor"
      );

    const backButton =
      document.querySelector(
        "#back-to-editor-selector"
      );

    function openEditor(
      url,
      name
    ) {
      selector.hidden = true;
      container.hidden = false;

      activeEditorName.textContent =
        name;

      frame.src = url;
    }

    function closeEditor() {
      frame.src = "about:blank";

      container.hidden = true;
      selector.hidden = false;

      activeEditorName.textContent =
        "Editor";
    }

    openRaptor.addEventListener(
      "click",
      () => {
        openEditor(
          "/editor/raptor.html",
          "Editor de Raptors"
        );
      }
    );

    openFood.addEventListener(
      "click",
      () => {
        openEditor(
          "/editor/food.html",
          "Editor de Food"
        );
      }
    );

    backButton.addEventListener(
      "click",
      closeEditor
    );

  </script></body>
</html>
