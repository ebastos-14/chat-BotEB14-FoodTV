<!DOCTYPE html><html lang="es">
<head>

  <title>Editor de mapa - chat-BotEB14-FoodTV</title>  <link rel="stylesheet" href="./editor.css">
</head><body>  <header class="editor-header">
    <div>
      <h1>Editor de mapa</h1>
      <p>chat-BotEB14-FoodTV</p>
    </div><div id="editor-status">
  Cargando...
</div>

  </header>  <main class="editor-layout"><section class="map-panel">
  <canvas
    id="editor-canvas"
    width="1536"
    height="1536"
    aria-label="Editor visual del mapa"
  ></canvas>
</section>

<aside class="editor-panel">

  <section>
    <h2>Ubicaciones</h2>

    <div
      id="element-list"
      class="element-list"
    ></div>
  </section>

  <section>
    <h2>Elemento seleccionado</h2>

    <label>
      ID

      <input
        id="element-id"
        type="text"
        autocomplete="off"
      >
    </label>

    <label>
      Tipo

      <select id="element-type">
        <option value="raptor">raptor</option>
      </select>
    </label>

    <label>
      Perfil

      <select id="element-profile">
        <option value="lateral">Lateral</option>
        <option value="front">Front</option>
        <option value="back">Back</option>
      </select>
    </label>

    <label>
      Raptor

      <select id="element-sheet">
        <option value="Raptor_Base.png">
          Raptor_Base.png
        </option>

        <option value="Raptor_Vip.png">
          Raptor_Vip.png
        </option>

        <option value="Raptor_Sub.png">
          Raptor_Sub.png
        </option>

        <option value="Raptor_Mod.png">
          Raptor_Mod.png
        </option>

        <option value="Raptor_EBastos14.png">
          Raptor_EBastos14.png
        </option>

        <option value="Raptor_JaciiTV_1.png">
          Raptor_JaciiTV_1.png
        </option>

        <option value="Raptor_JaciiTV_2.png">
          Raptor_JaciiTV_2.png
        </option>
      </select>
    </label>

    <div class="sprite-preview">
      <p>Vista previa</p>

      <canvas
        id="sprite-preview"
        width="220"
        height="220"
      ></canvas>
    </div>

    <div class="field-row">

      <label>
        X

        <input
          id="element-x"
          type="number"
          step="1"
        >
      </label>

      <label>
        Y

        <input
          id="element-y"
          type="number"
          step="1"
        >
      </label>

    </div>

    <label>
      Escala

      <input
        id="element-scale"
        type="number"
        step="0.0001"
        min="0.01"
      >
    </label>

    <label>
      Layer

      <input
        id="element-layer"
        type="number"
        step="1"
      >
    </label>

    <label class="checkbox-row">
      <input
        id="element-mirror"
        type="checkbox"
      >

      Mirror horizontal
    </label>

  </section>

  <section class="button-section">

    <button id="apply-element">
      Aplicar cambios
    </button>

    <button id="delete-element">
      Eliminar elemento
    </button>

    <button id="reset-element">
      Restablecer selección
    </button>

  </section>

  <section>

    <h2>Archivo JSON</h2>

    <button id="reload-map">
      Recargar map.json
    </button>

    <button id="export-json">
      Exportar JSON
    </button>

    <button id="copy-json">
      Copiar JSON
    </button>

    <textarea
      id="json-output"
      spellcheck="false"
      placeholder="Aquí aparecerá el JSON..."
    ></textarea>

  </section>

  <div id="editor-message"></div>

</aside>

  </main>  <script
    type="module"
    src="./editor.js"
  ></script></body>
</html>
