<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8"><meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

  <title>Editor de Food - chat-BotEB14-FoodTV</title>  <link rel="stylesheet" href="/editor/food/editor.css">
</head><body>  <main class="editor-page"><header class="editor-header">

  <div>
    <h1>Editor de Food</h1>

    <p>
      Configuración de comidas, bebidas, bolsas y ubicaciones
    </p>
  </div>

  <nav class="editor-nav">
    <a href="/">Juego</a>
    <a href="/editor/raptor/">Raptors</a>
    <a href="/editor/food/">Food</a>
  </nav>

</header>


<section class="editor-layout">


  <!-- ==============================
       MAPA
       ============================== -->

  <section class="editor-map-panel">

    <div class="panel-title">

      <h2>Mapa</h2>

      <span id="editor-status">
        Cargando...
      </span>

    </div>


    <div class="canvas-wrapper">

      <canvas
        id="editor-canvas"
        width="1280"
        height="720"
        aria-label="Mapa del restaurante"
      ></canvas>

    </div>

  </section>



  <!-- ==============================
       CONTROLES
       ============================== -->

  <aside class="editor-controls">


    <!-- ============================
         ELEMENTO
         ============================ -->

    <section class="editor-panel">

      <h2>Elemento</h2>

      <label for="entity-select">
        Ubicación
      </label>

      <select id="entity-select">

        <option value="">
          Seleccione una ubicación
        </option>

      </select>

    </section>



    <!-- ============================
         TIPO
         ============================ -->

    <section class="editor-panel">

      <h2>Tipo</h2>

      <label for="food-type">
        Tipo de elemento
      </label>

      <select id="food-type">

        <option value="food">
          Comida
        </option>

        <option value="drink">
          Bebida
        </option>

        <option value="bag">
          Bolsa
        </option>

      </select>

    </section>



    <!-- ============================
         SPRITESHEET
         ============================ -->

    <section class="editor-panel">

      <h2>Spritesheet</h2>

      <label for="sheet-select">
        Recurso
      </label>

      <select id="sheet-select">

        <optgroup label="Comidas">

          <option value="Menu_Taco.png">
            Taco
          </option>

          <option value="Menu_Hamburguesa.png">
            Hamburguesa
          </option>

          <option value="Menu_Burrito.png">
            Burrito
          </option>

          <option value="Menu_Hotdog.png">
            Hotdog
          </option>

          <option value="Menu_Sushi.png">
            Sushi
          </option>

          <option value="Menu_Pizza.png">
            Pizza
          </option>

          <option value="Menu_Sandwich.png">
            Sandwich
          </option>

        </optgroup>


        <optgroup label="Bebidas">

          <option value="Menu_Bebida.png">
            Bebida
          </option>

        </optgroup>


        <optgroup label="Bolsas">

          <option value="Menu_Bolsa.png">
            Bolsa
          </option>

        </optgroup>

      </select>

    </section>



    <!-- ============================
         SECCIÓN
         ============================ -->

    <section class="editor-panel">

      <h2>Sección</h2>

      <label for="section-select">
        Sección del spritesheet
      </label>

      <select id="section-select">

        <option value="1">
          1 — Vacío
        </option>

        <option value="2">
          2
        </option>

        <option value="3">
          3
        </option>

        <option value="4">
          4
        </option>

        <option value="5">
          5
        </option>

        <option value="6">
          6
        </option>

        <option value="7">
          7
        </option>

        <option value="8">
          8
        </option>

      </select>

    </section>



    <!-- ============================
         SOURCE
         ============================ -->

    <section class="editor-panel">

      <h2>Mapeo</h2>

      <p>
        Coordenadas de la sección dentro de la spritesheet.
      </p>


      <div class="field-grid">

        <div class="field">

          <label for="source-x">
            X
          </label>

          <input
            id="source-x"
            type="number"
            step="1"
            min="0"
          >

        </div>


        <div class="field">

          <label for="source-y">
            Y
          </label>

          <input
            id="source-y"
            type="number"
            step="1"
            min="0"
          >

        </div>


        <div class="field">

          <label for="source-width">
            Ancho
          </label>

          <input
            id="source-width"
            type="number"
            step="1"
            min="1"
          >

        </div>


        <div class="field">

          <label for="source-height">
            Alto
          </label>

          <input
            id="source-height"
            type="number"
            step="1"
            min="1"
          >

        </div>

      </div>


      <div class="button-row">

        <button
          id="apply-section"
          type="button"
        >
          Aplicar
        </button>

        <button
          id="generate-sections"
          type="button"
        >
          Generar 8
        </button>

      </div>

    </section>



    <!-- ============================
         POSICIÓN
         ============================ -->

    <section class="editor-panel">

      <h2>Posición</h2>


      <div class="field-grid">

        <div class="field">

          <label for="entity-x">
            X
          </label>

          <input
            id="entity-x"
            type="number"
            step="1"
          >

        </div>


        <div class="field">

          <label for="entity-y">
            Y
          </label>

          <input
            id="entity-y"
            type="number"
            step="1"
          >

        </div>


        <div class="field">

          <label for="entity-scale">
            Escala
          </label>

          <input
            id="entity-scale"
            type="number"
            step="0.001"
            min="0.01"
          >

        </div>


        <div class="field">

          <label for="entity-layer">
            Layer
          </label>

          <input
            id="entity-layer"
            type="number"
            step="1"
          >

        </div>

      </div>


      <div class="button-row">

        <button
          id="apply-entity"
          type="button"
        >
          Aplicar
        </button>

        <button
          id="reset-entity"
          type="button"
        >
          Restablecer
        </button>

        <button
          id="delete-entity"
          type="button"
          class="danger"
        >
          Eliminar
        </button>

      </div>

    </section>



    <!-- ============================
         UBICACIONES
         ============================ -->

    <section class="editor-panel">

      <h2>Ubicaciones</h2>

      <button
        id="add-entity"
        type="button"
      >
        + Agregar ubicación
      </button>

    </section>



    <!-- ============================
         JSON
         ============================ -->

    <section class="editor-panel">

      <h2>JSON</h2>


      <div class="button-row">

        <button
          id="export-json"
          type="button"
        >
          Exportar
        </button>

        <button
          id="copy-json"
          type="button"
        >
          Copiar
        </button>

      </div>


      <textarea
        id="json-data"
        rows="14"
        spellcheck="false"
        placeholder="Aquí aparecerá map-food.json..."
      ></textarea>


      <div class="button-row">

        <button
          id="import-json"
          type="button"
        >
          Importar JSON
        </button>

      </div>

    </section>

  </aside>

</section>

  </main>  <script
    type="module"
    src="/editor/food/food_editor.js"
  ></script></body>
</html>
